name: DevOps Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd app
          pip install -r requirements.txt

      - name: Run basic test
        run: |
          cd app
          python -c "from app import app; print('App imported successfully')"

      - name: Build Docker image
        run: |
          docker build -t damolak-app ./app

      - name: Run container test
        run: |
          docker run -d -p 5000:5000 --name test-container damolak-app
          sleep 5
          curl -f http://localhost:5000/health
          docker stop test-container
          docker rm test-container

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Build and push Docker image to ECR
        run: |
          aws ecr get-login-password --region eu-west-1 | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}
          docker build -t damolak-app ./app
          docker tag damolak-app:latest ${{ secrets.ECR_REGISTRY }}/damolak-app:latest
          docker push ${{ secrets.ECR_REGISTRY }}/damolak-app:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region eu-west-1 | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}
            docker pull ${{ secrets.ECR_REGISTRY }}/damolak-app:latest
            docker stop damolak-app || true
            docker rm damolak-app || true
            docker run -d \
              --name damolak-app \
              --restart always \
              -p 5000:5000 \
              ${{ secrets.ECR_REGISTRY }}/damolak-app:latest
